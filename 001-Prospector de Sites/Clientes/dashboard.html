<!DOCTYPE html>
<!-- TEMPLATE DO DASHBOARD (v3: 3 colunas + campos extras). A skill dashboard-leads gera o painel substituindo o marcador de dados dentro de <script id=dados> pelo snapshot JSON (atualizado + leads). -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospector — Painel</title>
<style>
:root{
 --paper:#F0EEE5;--surface:#FAF9F5;--white:#FFFFFF;--ink:#1F1E1D;--muted:#87837B;--line:#E3DFD5;
 --accent:#D97757;--accent-2:#C15F3C;--accent-soft:#F4E5DE;
 --ok:#6A9B72;--ok-soft:#E7EFE8;--warn:#C98A2D;--warn-soft:#F6ECD9;--cinza:#B7B2A7;
 --novo:#7A8CA8;--rede:#9C7BB8;--pub:#5E9DA8;--prop:#C98A2D;--resp:#6A9B72;--fech:#4E8757;
 --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,'Segoe UI',Roboto,Inter,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;overflow-x:hidden}
aside{width:232px;min-height:100vh;background:var(--ink);color:#EDEAE3;padding:22px 14px;position:fixed;top:0;bottom:0;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 20px;border-bottom:1px solid #3A3835;margin-bottom:16px}
.logo .burst{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
.logo b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.2px}
.logo span{display:block;font-size:10.5px;color:#A8A399;margin-top:1px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;color:#CFC9BE;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-family:var(--sans)}
nav button:hover{background:#33312E;color:#fff}
nav button.on{background:var(--accent);color:#fff}
nav button .qt{font-size:11px;background:#00000030;padding:1px 8px;border-radius:10px}
.side-foot{margin-top:auto;font-size:11px;color:#8B867C;padding:12px 10px;line-height:1.5}
main{margin-left:232px;flex:1;min-width:0;padding:22px 28px 0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:14px}
#view>.stats,#view>.painel,#view>.dica-drag,#view>.sites-grid{flex:0 0 auto}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;flex:0 0 auto}
.topbar h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:-.2px}
.topbar .upd{color:var(--muted);font-size:12px}
.busca{margin-left:auto;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13.5px;width:250px;color:var(--ink);font-family:var(--sans)}
.busca:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05}
.stat .l{color:var(--muted);font-size:12px;margin-top:5px;font-weight:600}
.stat.laranja .n{color:var(--accent)}.stat.verde .n{color:var(--fech)}.stat.ambar .n{color:var(--warn)}
.painel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.painel h2{font-family:var(--serif);font-size:17px;margin:0 0 14px;font-weight:600}
.funil .linha{display:grid;grid-template-columns:130px 1fr 40px;align-items:center;gap:12px;margin:9px 0;font-size:12.5px}
.funil .barra{height:22px;border-radius:6px;background:var(--paper);overflow:hidden}
.funil .fill{height:100%;border-radius:6px;min-width:2px}
.fup-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fup-item:last-child{border:0}
.fup-item .dias{background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:11px;padding:3px 9px;border-radius:12px;white-space:nowrap}
.board{display:flex;gap:14px;overflow-x:auto;align-items:stretch;flex:1;min-height:0;padding-bottom:4px}
.board::-webkit-scrollbar,.cards::-webkit-scrollbar{height:9px;width:9px}
.board::-webkit-scrollbar-thumb,.cards::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.board::-webkit-scrollbar-thumb:hover,.cards::-webkit-scrollbar-thumb:hover{background:var(--cinza)}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 8px 12px;flex:0 0 272px;width:272px;display:flex;flex-direction:column;min-height:0}
.cards{flex:1;overflow-y:auto;min-height:0;padding-right:6px}
.col>h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;margin:2px 4px 12px;display:flex;justify-content:space-between;color:var(--muted);flex:0 0 auto}
.card{background:var(--white);border:1px solid var(--line);border-top:3px solid var(--cor,var(--accent));border-radius:11px;padding:13px;margin-bottom:10px;box-shadow:0 1px 2px #0000000a}
.card .nm{font-weight:700;font-size:13.5px}
.card .mt{color:var(--muted);font-size:12px;margin:4px 0}
.card .motivo{color:var(--muted);font-size:12px;font-style:italic;margin:7px 0;border-left:2px solid var(--line);padding-left:8px;line-height:1.45}
.acoes{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.acoes a{font-size:11px;font-weight:700;text-decoration:none;padding:4px 10px;border-radius:7px;background:var(--paper);color:var(--accent-2);border:1px solid var(--line)}
.acoes a:hover{background:var(--accent-soft);border-color:var(--accent)}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:1px}
.fup{background:var(--warn-soft);color:var(--warn)}
.valor{color:var(--fech);font-weight:800;font-size:13px;margin-top:6px}
select.st{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface);color:var(--ink);font-family:var(--sans);margin-top:9px;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--surface)}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.painel.tab{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;margin-bottom:0}
.twrap{flex:1;min-height:0;overflow:auto}
.pagin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted);flex:0 0 auto;border-top:1px solid var(--line);padding-top:12px}
.pagin .info{margin-right:auto}
.pagin button{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:var(--sans)}
.pagin button:hover{border-color:var(--accent);color:var(--accent-2)}
.pagin button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pagin button:disabled{opacity:.4;cursor:default}
.pagin select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;background:var(--white);color:var(--ink);font-family:var(--sans)}
.sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.site-card{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.site-card .prev{height:190px;overflow:hidden;border-bottom:1px solid var(--line);background:var(--paper)}
.site-card iframe{width:200%;height:380px;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.site-card{display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.site-card:hover{box-shadow:0 6px 18px #00000014;transform:translateY(-2px)}
.site-card .info{padding:14px 16px 12px}
.s-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.s-nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-sub{color:var(--muted);font-size:12px;margin:3px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-main{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.s-main a{text-align:center;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:700;text-decoration:none}
.s-main .prim{background:var(--accent);color:#fff}
.s-main .prim:hover{background:var(--accent-2)}
.s-main .sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.s-main .sec:hover{border-color:var(--accent);color:var(--accent-2)}
.s-icons{display:flex;border-top:1px solid var(--line);padding-top:9px;margin:0 -4px}
.s-icons a{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:5px 2px;border-radius:7px}
.s-icons a:hover{background:var(--paper);color:var(--accent-2)}
.s-icons a.del:hover{color:#B0483B;background:#B0483B14}
.fin-check{width:17px;height:17px;accent-color:var(--fech);cursor:pointer}
select.mini{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--surface);color:var(--ink);font-family:var(--sans);cursor:pointer}
.btn-ct{display:inline-block;font-size:12px;font-weight:700;text-decoration:none;padding:6px 12px;border-radius:8px;margin:2px 4px 2px 0;white-space:nowrap}
.btn-ct.ver{background:var(--accent);color:#fff}
.btn-ct.ver:hover{background:var(--accent-2)}
.btn-ct.baixar{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn-ct.baixar:hover{border-color:var(--accent);color:var(--accent-2)}
.btn-ct.ass{background:var(--ok-soft);color:var(--ok)}
.ct-pendente{background:#B7B2A733;color:#6E6A63}.ct-enviado{background:var(--warn-soft);color:var(--warn)}.ct-assinado{background:var(--ok-soft);color:var(--ok)}
#doc-bg{position:fixed;inset:0;background:#000000AA;display:none;z-index:60;flex-direction:column}
#doc-bg.aberto{display:flex}
.doc-bar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--ink);color:#EDEAE3;flex:0 0 auto}
.doc-bar b{font-family:var(--serif);font-size:15px}
.doc-bar .sp{flex:1}
.doc-bar button{border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.doc-bar .imp{background:var(--accent);color:#fff}
.doc-bar .imp:hover{background:var(--accent-2)}
.doc-bar .fech{background:#3A3835;color:#EDEAE3}
#doc-frame{flex:1;border:0;width:100%;background:#E9E7E1}
.vazio{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 4px}
.card[draggable=true]{cursor:grab}
.card.arrastando{opacity:.45;transform:rotate(1.5deg)}
.col.alvo{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-soft)}
.dica-drag{color:var(--muted);font-size:11.5px;margin:0 0 10px}
.hidden{display:none}
.acoes a.del{color:#B0483B}
.modo{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px}
.modo.db{background:var(--ok-soft);color:var(--ok)}
.modo.file{background:var(--warn-soft);color:var(--warn)}
#modal-bg{position:fixed;inset:0;background:#00000055;display:none;align-items:center;justify-content:center;z-index:50}
#modal-bg.aberto{display:flex}
#modal{background:var(--white);border-radius:16px;padding:22px;width:940px;max-width:95vw;max-height:90vh;overflow-y:auto}
#modal h2{font-family:var(--serif);font-size:18px;margin:0 0 14px}
#modal label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px}
#modal input,#modal select,#modal textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:var(--sans);color:var(--ink);background:var(--surface)}
#modal .mrow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#modal .mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
#modal .mgrid .fld{min-width:0}
#modal .mgrid label{margin:8px 0 3px}
#modal .mgrid .span2{grid-column:span 2}#modal .mgrid .span3{grid-column:span 3}
@media(max-width:640px){#modal .mgrid{grid-template-columns:1fr}#modal .mgrid .span2,#modal .mgrid .span3{grid-column:auto}}
#modal .mbot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#modal .mbot button{border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}
#modal .salvar{background:var(--accent);color:#fff}
#modal .cancelar{background:var(--paper);color:var(--ink)}
@media(max-width:860px){aside{display:none}main{margin-left:0}}
.cmp-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cmp-tabs button{border:1px solid var(--line);background:var(--white);padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);font-family:var(--sans)}
.cmp-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1 1 auto;min-height:0}
.cmp-col{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:0}
.cmp-col .cab{padding:9px 14px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.cmp-col .cab.antes{color:var(--muted)} .cmp-col .cab.depois{color:var(--accent)}
.cmp-col iframe{flex:1 1 auto;width:100%;border:0;min-height:0;background:#fff}
@media(max-width:900px){.cmp-grid{grid-template-columns:1fr}}
</style>
</head>

<div class="fld"><label>Razão social</label><input id="m-razaoSocial"></div>

<div class="fld span2"><label>Endereço do cliente</label><input id="m-endCliente"></div>
<div class="fld"><label>Logo (Instagram)</label><img id="m-logo-prev" alt="" style="max-width:72px;max-height:72px;border-radius:8px;border:1px solid var(--line);display:none"></div>
<div class="fld"><label>Atualizado (auto)</label><input id="m-atualizado" disabled></div>
<div class="fld span3"><label>Observações</label><textarea id="m-obs" rows="2"></textarea></div>
</div>
<div class="mbot"><button class="cancelar" onclick="fecharEdit()">Cancelar</button><button class="salvar" onclick="salvarEdit()">Salvar</button></div>

<script>
var D=JSON.parse(document.getElementById('dados').textContent);

function aplicaOv(arr){return arr.filter(function(l){return !(OV[l.slug]&&OV[l.slug]._del)}).map(function(l){return Object.assign({},l,OV[l.slug]||{})})}

if(Object.keys(OV).length)document.getElementById('limpar-ov')&&(document.getElementById('limpar-ov').style.display='inline-block');
fetch('/api/leads',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){MODE='db';leads=j;fetch('/api/config',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){CFG=(c&&c.contratante!==undefined)?c.contratante:c;HG=(c&&c.hostgator)||{};if(view==='config')render()});var m=document.getElementById('modo');m.textContent='banco conectado';m.className='modo db';m.title='Alterações salvas no prospector.db';var lb=document.getElementById('limpar-ov');if(lb)lb.style.display='none';render()}).catch(function(){});
var CORES={novo:'var(--novo)',redesenhado:'var(--rede)',publicado:'var(--pub)',proposta:'var(--prop)',respondeu:'var(--resp)',fechado:'var(--fech)',descartado:'var(--cinza)'};
var NOMES={novo:'Novo',redesenhado:'Redesenhado',publicado:'Publicado',proposta:'Proposta enviada',respondeu:'Respondeu',fechado:'Fechado',descartado:'Descartado'};

var view='geral',busca='',sortCol='nome',sortAsc=true,pag=1,porPag='auto';

document.getElementById('upd').textContent='atualizado em '+(D.atualizado||'—');
function dias(iso){if(!iso)return 0;return Math.floor((Date.now()-new Date(iso+'T12:00:00'))/864e5)}
function ativos(){return fil().filter(function(l){return l.status!=='descartado'})}
function fil(){var b=busca.toLowerCase();return leads.filter(function(l){return !b||((l.nome||'')+(l.nicho||'')+(l.cidade||'')+(l.status||'')).toLowerCase().indexOf(b)>=0})}
function recarrega(){return fetch('/api/leads',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){leads=j;render()})}
function salvarOv(slug,ch){
 if(MODE==='db'){fetch('/api/leads/'+encodeURIComponent(slug),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(ch)}).then(recarrega);return}
 OV[slug]=Object.assign(OV[slug]||{},ch);localStorage.setItem('prospector_ov',JSON.stringify(OV));leads=aplicaOv(D.leads||[]);render()}
function deletar(slug){if(!confirm('Excluir este lead do painel?'))return;
 if(MODE==='db'){fetch('/api/leads/'+encodeURIComponent(slug),{method:'DELETE'}).then(recarrega);return}
 OV[slug]=Object.assign(OV[slug]||{},{_del:true});localStorage.setItem('prospector_ov',JSON.stringify(OV));leads=aplicaOv(D.leads||[]);render()}
var CFG={};
var editSlug=null;

 document.getElementById('m-titulo').textContent='Editar — '+(l.nome||slug);
 document.getElementById('m-status').innerHTML=Object.keys(NOMES).map(function(st){return '<option value="'+st+'"'+(l.status===st?' selected':'')+'>'+NOMES[st]+'</option>'}).join('');
 ['slug','nome','nicho','cidade','nota','avaliacoes','email','telefone','whatsapp','instagram','dominio','gmnCid','gmnUrl','siteAntigo','motivo','urlNova','valor','dataProposta','manutencao','valorTrimestral','diaVencimento','contratoEm','razaoSocial','responsavel','docCliente','endCliente','obs','atualizado'].forEach(function(k){var el=document.getElementById('m-'+k);if(el)el.value=l[k]==null?'':l[k]});
 document.getElementById('m-pago').value=l.pago?1:0;document.getElementById('m-contratoStatus').value=l.contratoStatus||'pendente';var lg=document.getElementById('m-logo-prev');if(lg){lg.src=l.logo||'';lg.style.display=l.logo?'block':'none'}
 document.getElementById('modal-bg').classList.add('aberto')}
function fecharEdit(){document.getElementById('modal-bg').classList.remove('aberto');editSlug=null}

 ['nome','nicho','cidade','email','telefone','whatsapp','instagram','dominio','gmnCid','gmnUrl','siteAntigo','motivo','urlNova','dataProposta','contratoEm','razaoSocial','responsavel','docCliente','endCliente','obs'].forEach(function(k){ch[k]=document.getElementById('m-'+k).value||null});
 var nt=document.getElementById('m-nota').value;ch.nota=nt===''?null:parseFloat(nt);

 var dvc=document.getElementById('m-diaVencimento').value;ch.diaVencimento=dvc===''?null:parseInt(dvc);

 ch.status=document.getElementById('m-status').value;
 var v=document.getElementById('m-valor').value;ch.valor=v===''?null:parseFloat(v);

 ch.pago=parseInt(document.getElementById('m-pago').value);ch.contratoStatus=document.getElementById('m-contratoStatus').value;
 var slug=editSlug;fecharEdit();salvarOv(slug,ch)}
function setView(v){view=v;render()}
function nav(){
 var fu=fil().filter(function(l){return l.status==='proposta'&&dias(l.dataProposta)>=4});
 var fechadosN=fil().filter(function(l){return l.status==='fechado'}).length;
 var itens=[['geral','Visão geral',null],['pipeline','Pipeline',ativos().length],['clientes','Clientes',fil().length],['sites','Sites',fil().filter(function(l){return['redesenhado','publicado','proposta','respondeu','fechado'].indexOf(l.status)>=0}).length],['comparador','Comparador',fil().filter(function(l){return l.slug&&['redesenhado','publicado','proposta','respondeu','fechado'].indexOf(l.status)>=0}).length],['followup','Follow-ups',fu.length],['contratos','Contratos',fechadosN],['financeiro','Financeiro',null],['config','Configurações',null]];
 document.getElementById('nav').innerHTML=itens.map(function(i){return '<button class="'+(view===i[0]?'on':'')+'" onclick="setView(\''+i[0]+'\')">'+i[1]+(i[2]!==null?'<span class="qt">'+i[2]+'</span>':'')+'</button>'}).join('');
 document.getElementById('titulo').textContent=itens.filter(function(i){return i[0]===view})[0][1];
}

function acoes(l){var a=[];
 if(l.siteAntigo)a.push('<a href="'+l.siteAntigo+'" target="_blank">antigo</a>');
 if(l.slug&&['redesenhado','publicado','proposta','respondeu','fechado'].indexOf(l.status)>=0){a.push('<a href="sites/'+l.slug+'/'+l.slug+'.html" target="_blank">página</a>');a.push('<a href="sites/'+l.slug+'/'+l.slug+'-editor.html" target="_blank">editar site</a>')}
 if(l.urlNova)a.push('<a href="'+l.urlNova+'" target="_blank">no ar ↗</a>');
 if(l.whatsapp)a.push('<a href="https://wa.me/'+l.whatsapp+'" target="_blank">whatsapp</a>');

 if(l.instagram){var ig=String(l.instagram).indexOf('http')===0?l.instagram:'https://instagram.com/'+String(l.instagram).replace(/^@/,'');a.push('<a href="'+ig+'" target="_blank">instagram</a>')}
 if(l.gmnUrl)a.push('<a href="'+l.gmnUrl+'" target="_blank">google</a>');
 a.push('<a href="#" onclick="abrirEdit(\''+l.slug+'\');return false">✎ dados</a>');
 a.push('<a href="#" class="del" onclick="deletar(\''+l.slug+'\');return false">✕ excluir</a>');
 return '<div class="acoes">'+a.join('')+'</div>'}

function card(l){var f=l.status==='proposta'&&dias(l.dataProposta)>=4?'<span class="tag fup">follow-up '+dias(l.dataProposta)+'d</span>':'';
 return '<div class="card" draggable="true" ondragstart="dragIni(event,\''+l.slug+'\')" ondragend="dragFim(event)" style="--cor:'+CORES[l.status]+'"><div class="nm">'+l.nome+f+'</div><div class="mt">'+(l.nota?'★ '+l.nota+' ('+l.avaliacoes+')':'')+(l.cidade?' · '+l.cidade:'')+'</div>'+(l.motivo?'<div class="motivo">'+l.motivo+'</div>':'')+(l.obs?'<div class="mt">'+l.obs+'</div>':'')+(l.valor?'<div class="valor">R$ '+l.valor.toLocaleString('pt-BR')+(l.manutencao?' <span style="color:var(--muted);font-weight:600;font-size:11px">+ R$ '+l.manutencao.toLocaleString('pt-BR')+'/mês</span>':'')+'</div>':'')+acoes(l)+'</div>'}
function vGeral(){
 var ls=fil(),at=ativos();
 var props=ls.filter(function(l){return l.status==='proposta'});
 var fu=props.filter(function(l){return dias(l.dataProposta)>=4});
 var fech=ls.filter(function(l){return l.status==='fechado'});
 var receita=fech.reduce(function(a,l){return a+(l.valor||0)},0);
 var pot=at.length*700;
 var html='<div class="stats">'+[['Leads ativos',at.length,''],['Propostas na rua',props.length,''],['Follow-ups pendentes',fu.length,'ambar'],['Fechados',fech.length,'verde'],['Receita fechada','R$ '+receita.toLocaleString('pt-BR'),'verde'],['Potencial (R$700/página)','R$ '+pot.toLocaleString('pt-BR'),'laranja']].map(function(s){return '<div class="stat '+s[2]+'"><div class="n">'+s[1]+'</div><div class="l">'+s[0]+'</div></div>'}).join('')+'</div>';
 var max=Math.max.apply(null,ORDEM.map(function(s){return ls.filter(function(l){return l.status===s}).length}).concat([1]));
 html+='<div class="painel funil"><h2>Funil do pipeline</h2>'+ORDEM.map(function(s){var n=ls.filter(function(l){return l.status===s}).length;return '<div class="linha"><span>'+NOMES[s]+'</span><div class="barra"><div class="fill" style="width:'+(n/max*100)+'%;background:'+CORES[s]+'"></div></div><b>'+n+'</b></div>'}).join('')+'</div>';
 html+='<div class="painel"><h2>Follow-ups pendentes (4+ dias sem resposta)</h2>'+(fu.length?fu.map(function(l){return '<div class="fup-item"><b>'+l.nome+'</b><span class="dias">'+dias(l.dataProposta)+' dias</span><span style="color:var(--muted);font-size:12px">proposta em '+l.dataProposta+'</span>'+(l.whatsapp?'<a style="margin-left:auto;font-size:12px;font-weight:700;color:var(--accent-2)" href="https://wa.me/'+l.whatsapp+'" target="_blank">chamar no WhatsApp →</a>':'')+'</div>'}).join(''):'<div class="vazio">Nenhum follow-up pendente. 👌</div>')+'</div>';
 return html}
function vPipeline(){var por={};fil().forEach(function(l){(por[l.status]=por[l.status]||[]).push(l)});
 return '<p class="dica-drag">Arraste um card para mudar o status — os automáticos (redesenhado, publicado, proposta) o plugin move sozinho; use o arrasto principalmente para <b>Respondeu</b> e <b>Fechado</b>.</p><div class="board">'+ORDEM.concat(['descartado']).map(function(s){var arr=por[s]||[];return '<div class="col" data-st="'+s+'" ondragover="dragSobre(event)" ondragleave="dragSai(event)" ondrop="solta(event,\''+s+'\')"><h3>'+NOMES[s]+'<span>'+arr.length+'</span></h3><div class="cards">'+(arr.length?arr.map(card).join(''):'<div class="vazio">solte aqui</div>')+'</div></div>'}).join('')+'</div>'}

 var ini=(pag-1)*pp,fim=Math.min(ini+pp,total);ls=ls.slice(ini,fim);
 return '<div class="painel tab"><div class="twrap"><table><thead><tr>'+[['nome','Cliente'],['nota','Nota'],['avaliacoes','Aval.'],['cidade','Cidade'],['status','Status'],['valor','Valor'],['x','Contato / páginas']].map(function(c){return '<th onclick="ordenar(\''+c[0]+'\')">'+c[1]+(sortCol===c[0]?(sortAsc?' ↑':' ↓'):'')+'</th>'}).join('')+'</tr></thead><tbody>'+ls.map(function(l){return '<tr><td><b>'+l.nome+'</b><div style="color:var(--muted);font-size:11.5px">'+(l.email||'sem e-mail')+'</div></td><td>'+(l.nota?'★ '+l.nota:'—')+'</td><td>'+(l.avaliacoes||'—')+'</td><td>'+(l.cidade||'—')+'</td><td>'+pillStatus(l.status)+'</td><td>'+(l.valor?'R$ '+l.valor.toLocaleString('pt-BR'):'—')+'</td><td>'+acoes(l)+'</td></tr>'}).join('')+'</tbody></table></div><div class="pagin"><span class="info">Mostrando '+(total?ini+1:0)+'–'+fim+' de '+total+' clientes</span><select onchange="mudaPorPag(this.value)"><option value="auto"'+(porPag==='auto'?' selected':'')+'>Auto ('+pp+' / página)</option>'+[10,25,50].map(function(n){return '<option value="'+n+'"'+(porPag===n?' selected':'')+'>'+n+' / página</option>'}).join('')+'</select><button onclick="irPag('+(pag-1)+')"'+(pag<=1?' disabled':'')+'>‹</button>'+Array.apply(null,{length:paginas}).map(function(_,i){return '<button class="'+(pag===i+1?'on':'')+'" onclick="irPag('+(i+1)+')">'+(i+1)+'</button>'}).join('')+'<button onclick="irPag('+(pag+1)+')"'+(pag>=paginas?' disabled':'')+'>›</button></div></div>'}

function vFollowup(){var fu=fil().filter(function(l){return l.status==='proposta'&&dias(l.dataProposta)>=4});
 return '<div class="painel"><h2>Propostas aguardando follow-up</h2>'+(fu.length?fu.map(card).join(''):'<div class="vazio">Nenhum follow-up pendente.</div>')+'</div>'}
function abrirContrato(slug,nome){document.getElementById('doc-titulo').textContent='Contrato — '+nome;document.getElementById('doc-frame').src='sites/'+slug+'/contrato-'+slug+'.html';document.getElementById('doc-bg').classList.add('aberto')}
function fecharDoc(){document.getElementById('doc-bg').classList.remove('aberto');document.getElementById('doc-frame').src='about:blank'}
function printDoc(){var f=document.getElementById('doc-frame');try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(f.src,'_blank');alert('Abri o contrato em nova aba — use Ctrl+P para imprimir/salvar PDF.')}}
function pillCt(st){st=st||'pendente';return '<span class="pill ct-'+st+'">'+st.charAt(0).toUpperCase()+st.slice(1)+'</span>'}
function vContratos(){var ls=fil().filter(function(l){return l.status==='fechado'});
 if(!ls.length)return '<div class="painel vazio">Nenhum cliente fechado ainda. Quando fechar, arraste o card pra "Fechado" e peça ao Claude: /contrato [cliente].</div>';
 return '<div class="painel" style="overflow-x:auto"><table><thead><tr><th>Cliente</th><th>Valor</th><th>Manutenção</th><th>Contrato</th><th>Data</th><th>Pago</th><th>Ações</th></tr></thead><tbody>'+ls.map(function(l){
  var doc='sites/'+l.slug+'/contrato-'+l.slug+'.html';
  var acao=(l.contratoStatus&&l.contratoStatus!=='pendente')?'<a href="#" class="btn-ct ver" onclick="abrirContrato(\''+l.slug+'\',\''+l.nome.replace(/'/g,'')+'\');return false" title="abrir a folha do contrato aqui no painel">👁 Ver contrato</a><a href="sites/'+l.slug+'/contrato-'+l.slug+'.docx" download class="btn-ct baixar" title="baixa o Word travado que vai pro cliente">⬇ Baixar .docx</a>'+(l.contratoStatus==='assinado'?'<a href="sites/'+l.slug+'/contrato-'+l.slug+'-assinado.docx" download class="btn-ct ass">✓ Assinado</a>':'')+'':'<span style="color:var(--muted);font-size:12px">peça /contrato ao Claude</span>';
  return '<tr><td><b>'+l.nome+'</b></td><td>'+(l.valor?'R$ '+l.valor.toLocaleString('pt-BR'):'—')+'</td><td>'+(l.manutencao?'R$ '+l.manutencao.toLocaleString('pt-BR')+'/mês':'—')+'</td><td><select class="mini" onchange="salvarOv(\''+l.slug+'\',{contratoStatus:this.value})">'+['pendente','enviado','assinado'].map(function(cs){return '<option value="'+cs+'"'+((l.contratoStatus||'pendente')===cs?' selected':'')+'>'+cs+'</option>'}).join('')+'</select></td><td>'+(l.contratoEm||'—')+'</td><td><input type="checkbox" class="fin-check" '+(l.pago?'checked':'')+' onchange="salvarOv(\''+l.slug+'\',{pago:this.checked?1:0})"></td><td>'+acao+'</td></tr>'
 }).join('')+'</tbody></table></div>'}
function vFinanceiro(){var ls=fil().filter(function(l){return l.status==='fechado'});
 var recebido=ls.filter(function(l){return l.pago}).reduce(function(a,l){return a+(l.valor||0)},0);
 var areceber=ls.filter(function(l){return !l.pago}).reduce(function(a,l){return a+(l.valor||0)},0);
 var mrr=ls.reduce(function(a,l){return a+(l.manutencao||0)},0);
 var fmt=function(n){return 'R$ '+n.toLocaleString('pt-BR')};
 var html='<div class="stats">'+[['Recebido',fmt(recebido),'verde'],['A receber',fmt(areceber),'ambar'],['Manutenções (MRR)',fmt(mrr)+'/mês','laranja'],['Projeção 12 meses',fmt(recebido+areceber+mrr*12),'verde']].map(function(x){return '<div class="stat '+x[2]+'"><div class="n">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>'}).join('')+'</div>';
 html+='<div class="painel" style="overflow-x:auto"><h2>Fechamentos</h2>'+(ls.length?'<table><thead><tr><th>Cliente</th><th>Valor</th><th>Pago</th><th>Manutenção/mês</th><th>Contrato</th></tr></thead><tbody>'+ls.map(function(l){return '<tr><td><b>'+l.nome+'</b></td><td>'+(l.valor?fmt(l.valor):'—')+'</td><td><input type="checkbox" class="fin-check" '+(l.pago?'checked':'')+' onchange="salvarOv(\''+l.slug+'\',{pago:this.checked?1:0})"></td><td>'+(l.manutencao?fmt(l.manutencao):'—')+'</td><td>'+pillCt(l.contratoStatus)+'</td></tr>'}).join('')+'</tbody></table>':'<div class="vazio">Sem fechamentos ainda — a projeção começa no primeiro card arrastado pra Fechado.</div>')+'</div>';
 html+='<div class="painel"><h2>Como o financeiro se alimenta</h2><p style="font-size:13px;color:var(--muted);margin:0">Valor e manutenção entram quando você fecha (drag no kanban ou ✎ dados). "Pago" você marca aqui com um clique. O contrato muda pra "enviado" quando o Claude gera via /contrato — e pra "assinado" quando você marcar.</p></div>';
 return html}
var CFG_CAMPOS=[['nome','Nome completo / razão social'],['cpfCnpj','CPF ou CNPJ'],['endereco','Endereço (rua, nº, bairro)'],['cidadeUf','Cidade/UF'],['email','E-mail'],['whatsapp','WhatsApp (55DDDnúmero)']];
function vConfig(){
 var db=MODE==='db';
 var campos=CFG_CAMPOS.map(function(c){return '<div><label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px">'+c[1]+'</label><input id="cfg-'+c[0]+'" value="'+((CFG[c[0]]||'').replace(/"/g,'&quot;'))+'" '+(db?'':'disabled')+' style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:var(--sans);color:var(--ink);background:var(--surface)"></div>'}).join('');
 return '<div class="painel" style="max-width:640px"><h2>Meus dados — quem assina os contratos</h2><p style="font-size:13px;color:var(--muted);margin:0 0 6px">Preencha uma vez e todo contrato gerado pelo /contrato já sai com os seus dados de CONTRATADO(A) completos. Fica salvo no prospector-config.json, no seu computador.</p>'+campos+'<div style="margin-top:18px;display:flex;gap:10px;align-items:center"><button '+(db?'':'disabled')+' onclick="salvarCfg()" style="border:0;border-radius:10px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff">Salvar meus dados</button><span id="cfg-ok" style="color:var(--ok);font-weight:700;font-size:13px;display:none">salvo ✓</span>'+(db?'':'<span style="color:var(--warn);font-size:12.5px;font-weight:600">abra pelo iniciar-dashboard.bat para editar — ou dite os dados pro Claude no /setup</span>')+'</div></div>'+
 '<div class="painel" style="max-width:640px"><h2>Conex\u00e3o HostGator \u2014 publica\u00e7\u00e3o autom\u00e1tica</h2><p style="font-size:13px;color:var(--muted);margin:0 0 6px">Preencha uma vez e o /publicar sobe os sites sozinho, sem login no cPanel. A senha vai deste painel DIRETO pro arquivo no seu computador \u2014 nunca passa pelo chat.</p>'+[['usuario','Usu\u00e1rio do cPanel','text'],['dominio','Dom\u00ednio principal','text'],['servidor','Servidor (ex.: br1024.hostgator.com.br)','text'],['pastaBase','Pasta base (padr\u00e3o: clientes)','text'],['senha','Senha do cPanel','password']].map(function(c){var ph=c[0]==='senha'?(HG.senhaDefinida?'\u2022\u2022\u2022\u2022\u2022 salva \u2014 deixe em branco pra manter':'cole a senha do cPanel'):'';return '<div><label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px">'+c[1]+'</label><input id="hg-'+c[0]+'" type="'+c[2]+'" placeholder="'+ph+'" value="'+(c[0]==='senha'?'':((HG[c[0]]||'').replace(/"/g,'&quot;')))+'" '+(db?'':'disabled')+' style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;font-family:var(--sans);background:'+(db?'var(--white)':'#f0ede4')+'"></div>'}).join('')+'<div style="margin-top:18px;display:flex;gap:10px;align-items:center"><button '+(db?'':'disabled')+' onclick="salvarHG()" style="border:0;border-radius:10px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff">Salvar conex\u00e3o</button><span id="hg-ok" style="color:var(--ok);font-weight:700;font-size:13px;display:none">salvo \u2713</span>'+(db?(HG.senhaDefinida?'<span style="color:var(--ok);font-size:12.5px;font-weight:600">\u2713 senha configurada</span>':'<span style="color:var(--warn);font-size:12.5px;font-weight:600">falta a senha pra publica\u00e7\u00e3o autom\u00e1tica</span>'):'<span style="color:var(--warn);font-size:12.5px;font-weight:600">abra pelo iniciar-dashboard.bat para editar</span>')+'</div></div>'+
 '<div class="painel" style="max-width:640px"><h2>E os dados do cliente?</h2><p style="font-size:13px;color:var(--muted);margin:0">CPF/CNPJ e endereço do cliente entram quando ele fechar: peça pelo WhatsApp e (1) cole a resposta pro Claude no /contrato — ele extrai e salva sozinho — ou (2) preencha no ✎ dados do card. O que faltar sai como "preencher" na minuta.</p></div>'}
function salvarCfg(){var body={};CFG_CAMPOS.forEach(function(c){body[c[0]]=document.getElementById('cfg-'+c[0]).value||''});
 fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({contratante:body})}).then(function(){CFG=body;var ok=document.getElementById('cfg-ok');ok.style.display='inline';setTimeout(function(){ok.style.display='none'},2000)})}
function salvarHG(){var body={};['usuario','dominio','servidor','pastaBase','senha'].forEach(function(k){var el=document.getElementById('hg-'+k);if(el)body[k]=el.value||''});
 fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostgator:body})}).then(function(){if(body.senha)HG.senhaDefinida=true;['usuario','dominio','servidor','pastaBase'].forEach(function(k){if(body[k]!==undefined)HG[k]=body[k]});var ok=document.getElementById('hg-ok');ok.style.display='inline';setTimeout(function(){ok.style.display='none';render()},1200)})}
function ordenar(c){if(c==='x')return;if(sortCol===c)sortAsc=!sortAsc;else{sortCol=c;sortAsc=true}pag=1;render()}
var cmpSel=null;var HG={};
function vComparador(){var ls=fil().filter(function(l){return l.slug&&['redesenhado','publicado','proposta','respondeu','fechado'].indexOf(l.status)>=0});
 if(!ls.length)return '<div class="painel"><div class="vazio">Sem sites redesenhados ainda — rode /redesenhar no Claude e o antes/depois aparece aqui.</div></div>';
 if(!cmpSel||!ls.some(function(l){return l.slug===cmpSel}))cmpSel=ls[0].slug;
 var l=ls.filter(function(x){return x.slug===cmpSel})[0];
 var antiga=l.siteAntigo?((l.siteAntigo.indexOf('http')===0?l.siteAntigo:'https://'+l.siteAntigo)):null;
 var nova='sites/'+l.slug+'/'+l.slug+'.html';
 return '<div class="cmp-tabs">'+ls.map(function(x){return '<button class="'+(x.slug===cmpSel?'on':'')+'" onclick="cmpSel=\''+x.slug+'\';render()">'+x.nome+'</button>'}).join('')+'</div>'
 +'<div class="cmp-grid"><div class="cmp-col"><div class="cab antes">Antes — site atual'+(antiga?' · <a href="'+antiga+'" target="_blank" style="color:inherit">abrir ↗</a>':'')+'</div>'+(antiga?'<iframe src="'+antiga+'" loading="lazy"></iframe>':'<div class="vazio" style="padding:30px">Sem URL do site antigo registrada.</div>')+'</div>'
 +'<div class="cmp-col"><div class="cab depois">Depois — nova versão · <a href="'+nova+'" target="_blank" style="color:inherit">abrir ↗</a></div><iframe src="'+nova+'"></iframe></div></div>'
 +'<div style="font-size:11.5px;color:var(--muted);margin-top:8px">Alguns sites antigos bloqueiam visualização embutida — se o lado "Antes" ficar em branco, use o link "abrir ↗".</div>'}
function render(){nav();document.getElementById('view').innerHTML={geral:vGeral,pipeline:vPipeline,clientes:vClientes,sites:vSites,comparador:vComparador,followup:vFollowup,contratos:vContratos,financeiro:vFinanceiro,config:vConfig}[view]()}
var dragSlug=null;
function dragIni(e,slug){dragSlug=slug;e.target.classList.add('arrastando');e.dataTransfer.effectAllowed='move'}
function dragFim(e){e.target.classList.remove('arrastando')}
function dragSobre(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('alvo')}
function dragSai(e){e.currentTarget.classList.remove('alvo')}
function solta(e,st){e.preventDefault();e.currentTarget.classList.remove('alvo');if(!dragSlug)return;
 var ch={status:st};
 if(st==='fechado'){var v=prompt('Fechou! Valor cobrado (R$):','700');if(v!==null&&v!==''&&!isNaN(parseFloat(v)))ch.valor=parseFloat(v)}
 if(st==='proposta'&&!leads.filter(function(l){return l.slug===dragSlug})[0].dataProposta)ch.dataProposta=new Date().toISOString().slice(0,10);
 salvarOv(dragSlug,ch);dragSlug=null}
document.getElementById('busca').addEventListener('input',function(){busca=this.value;pag=1;render()});
var rsz;window.addEventListener('resize',function(){clearTimeout(rsz);rsz=setTimeout(render,150)});
render();
</script>
</body>
</html>
